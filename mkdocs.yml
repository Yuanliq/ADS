site_name: ADSNote
theme:
    name: "material"
    font:
      text: Noto Serif SC
      code: JetBrains Mono
    icon:
        logo: "fontawesome/solid/book"
    palette:
        primary: "black"
        accent: "deep orange"
    language: "zh"
markdown_extensions:
    - admonition
    - pymdownx.details
    - pymdownx.superfences
    - pymdownx.highlight:
        anchor_linenums: true
        line_spans: __span
        pygments_lang_class: true
    - pymdownx.inlinehilite
    - pymdownx.superfences
extra_css:
    - stylesheets/extra.css